name: Publier un article de blog (2/semaine)

on:
  schedule:
    # Lundi et jeudi à 06:00 UTC (~08:00 Madrid en été, 07:00 en hiver).
    # La sélection se fait par DATE (publish_date), pas par l'heure exacte.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      force:
        description: "Publier maintenant le prochain article de la file, sans attendre sa date"
        type: boolean
        default: false

permissions:
  contents: write         # nécessaire pour committer/pusher

concurrency:
  group: publish-blog     # évite deux publications simultanées
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node (pour wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Publication + fichiers statiques + index /blog/ + sitemap + commit + push,
      # avec reprise si main a bougé pendant le run (photos-bot pousse toutes
      # les 2 à 5 minutes ; c'est ce qui a fait échouer le run du 01/10).
      # Détails dans _tools/publier_avec_reprise.sh.
      - name: Publier le prochain article dû, committer et pousser
        id: publish
        env:
          # force=true → on fixe une date lointaine pour rendre le prochain article "dû"
          PUBLISH_DATE_OVERRIDE: ${{ inputs.force && '2099-12-31' || '' }}
        run: bash _tools/publier_avec_reprise.sh

      - name: Déployer sur Cloudflare Workers
        if: steps.publish.outputs.published == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy

      - name: Résumé
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            # avant le 03/10, un échec affichait « Aucun article dû » : trompeur
            echo "❌ Échec : article non publié ou non déployé, voir l'étape en rouge. Relancer avec Run workflow." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.publish.outputs.published }}" = "true" ]; then
            echo "✅ Article publié et déployé : ${{ steps.publish.outputs.slug }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Aucun article dû aujourd'hui — rien publié." >> "$GITHUB_STEP_SUMMARY"
          fi
