name: Déployer sur Cloudflare Workers

# Déploie le site à chaque push sur `main`.
#
# Note : les pushes faits par le workflow blog (publish-blog.yml) utilisent le
# GITHUB_TOKEN et ne déclenchent donc PAS ce workflow — c'est voulu, ce workflow-là
# fait déjà son propre `wrangler deploy` juste après avoir committé.

on:
  push:
    branches: [main]
    paths-ignore:
      # Fichiers non déployés (cf. .assetsignore) : inutile de redéployer pour eux.
      - 'CLAUDE.md'
      - '.github/**'
      - '.claude/**'
      - '_tools/**'
      - 'scripts/**'
      - 'calendrier.json'
      - 'blog-spa-data.json'
      - 'template-article.html'
      - '.gitignore'
  workflow_dispatch:          # permet un redéploiement manuel depuis l'onglet Actions

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true    # un push plus récent annule le déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2      # pour lister les pages modifiées (IndexNow)

      - name: Setup Node (pour wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Déployer sur Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy

      - name: Prévenir Bing et les moteurs IndexNow des pages modifiées
        if: success()
        continue-on-error: true
        env:
          INDEXNOW_KEY: c8f9d45149db8aaaa3b733b8c19f41ca
        run: |
          URLS=$(git diff --name-only HEAD~1 HEAD -- '*.html' \
            | grep -v -E '(^|/)(404|template-article)\.html$|^demo-|^_tools/|^scripts/' \
            | sed -E 's#(^|/)index\.html$#\1#; s#\.html$##; s#^#https://webautonomos.es/#' \
            | head -10000)
          [ -z "$URLS" ] && { echo "Aucune page modifiée"; exit 0; }
          echo "$URLS"
          jq -n --arg k "$INDEXNOW_KEY" --arg u "$URLS" \
            '{host:"webautonomos.es",key:$k,keyLocation:("https://webautonomos.es/"+$k+".txt"),urlList:($u|split("\n"))}' \
            | curl -sS -o /dev/null -w "IndexNow : HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @-

      - name: Résumé
        if: always()
        run: |
          echo "Déploiement de ${{ github.sha }} — statut ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
