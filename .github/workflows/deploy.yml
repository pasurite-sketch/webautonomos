name: Déployer sur Cloudflare Workers

# Déploie le site à chaque push sur `main`.
#
# Note : les pushes faits par le workflow blog (publish-blog.yml) utilisent le
# GITHUB_TOKEN et ne déclenchent donc PAS ce workflow — c'est voulu, ce workflow-là
# fait déjà son propre `wrangler deploy` juste après avoir committé.

on:
  push:
    branches: [main]
    paths-ignore:
      # Fichiers non déployés (cf. .assetsignore) : inutile de redéployer pour eux.
      - 'CLAUDE.md'
      - '.github/**'
      - '.claude/**'
      - '_tools/**'
      - 'scripts/**'
      - 'calendrier.json'
      - 'blog-spa-data.json'
      - 'template-article.html'
      - '.gitignore'
  workflow_dispatch:          # permet un redéploiement manuel depuis l'onglet Actions

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true    # un push plus récent annule le déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node (pour wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Déployer sur Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy

      - name: Résumé
        if: always()
        run: |
          echo "Déploiement de ${{ github.sha }} — statut ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
