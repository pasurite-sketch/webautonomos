/* ============================================================
   Design tokens — valeurs Tailwind figées, reprises du site
   ============================================================ */
:root{
  --blue-600:#2563eb; --blue-700:#1d4ed8; --blue-500:#3b82f6;
  --blue-200:#bfdbfe; --blue-100:#dbeafe; --blue-50:#eff6ff;
  --green-600:#16a34a; --green-700:#15803d; --green-500:#22c55e; --green-50:#f0fdf4;
  --yellow-400:#facc15; --yellow-300:#fde047;
  --gray-900:#111827; --gray-800:#1f2937; --gray-700:#374151; --gray-600:#4b5563;
  --gray-500:#6b7280; --gray-400:#9ca3af; --gray-300:#d1d5db; --gray-200:#e5e7eb;
  --gray-100:#f3f4f6; --gray-50:#f9fafb;
  --red-500:#ef4444;
  --wa:#25D366;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  --shadow-xl:0 20px 25px -5px rgb(0 0 0 / .1), 0 8px 10px -6px rgb(0 0 0 / .1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--gray-800); background:#fff; line-height:1.6;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* Dégagement sous le header fixe quand on saute à une ancre */
#problema,#como-funciona,#formulario,#faq{scroll-margin-top:5rem}

.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.wrap-narrow{max-width:48rem;margin:0 auto;padding:0 1rem}
.section{padding:5rem 0}
.section-alt{background:var(--gray-50)}
.center{text-align:center}

h2{font-size:1.875rem;font-weight:700;color:var(--gray-800);line-height:1.25}
.lead{color:var(--gray-600);font-size:1.125rem}
.mb-4{margin-bottom:1rem}.mb-6{margin-bottom:1.5rem}.mb-12{margin-bottom:3rem}

.gradient-hero{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 50%,#16a34a 100%)}
.gradient-btn{background:linear-gradient(135deg,#2563eb,#16a34a);transition:background .2s}
.gradient-btn:hover:not(:disabled){background:linear-gradient(135deg,#1d4ed8,#15803d)}

/* ============================ Header ============================ */
.site-header{
  position:fixed; top:0; left:0; right:0; z-index:50;
  background:rgb(255 255 255 / .95);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  box-shadow:var(--shadow-sm);
}
.site-header .bar{
  max-width:1220px;margin:0 auto;padding:.75rem 1rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.logo{display:flex;align-items:center;gap:.5rem}
.logo-mark{
  width:2rem;height:2rem;border-radius:.75rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.logo-mark svg{width:1rem;height:1rem;color:#fff}
.logo-text{font-weight:700;font-size:1rem;color:var(--gray-800);white-space:nowrap}
.logo-text .b{color:var(--blue-600)} .logo-text .g{color:var(--green-500)}
.header-phone{
  display:none;align-items:center;gap:.5rem;
  color:var(--gray-600);text-decoration:none;font-size:.875rem;font-weight:500;
  padding:.25rem .75rem;border-radius:9999px;border:1px solid var(--gray-200);
  white-space:nowrap;transition:color .2s,border-color .2s;
}
.header-phone:hover{color:var(--green-600);border-color:#4ade80}
.header-phone svg{width:1rem;height:1rem;flex-shrink:0}

/* ---- Onglets de section (aligne sur diagnostico-automatizacion) ---- */
.nav-links{display:none;align-items:center;gap:1rem;margin-left:1rem;
  font-size:.875rem;font-weight:600;white-space:nowrap}
.nav-links a{color:var(--blue-600);text-decoration:none;padding:.25rem .5rem;
  border-radius:.5rem;transition:color .2s,background-color .2s}
.nav-links a:hover{color:var(--blue-700);background:var(--blue-50)}
.nav-right{display:flex;align-items:center;gap:.5rem;margin-left:auto;flex:none}

/* ---- Selecteur de langue ---- */
.langs{position:relative}
.lang-btn{display:flex;align-items:center;gap:.375rem;height:2rem;padding:0 .5rem;
  background:var(--gray-100);border:1px solid var(--gray-200);border-radius:9999px;
  cursor:pointer;transition:background-color .2s,border-color .2s}
.lang-btn:hover{background:#fff;border-color:var(--blue-200)}
.lang-btn:focus-visible,.lang-menu li:focus-visible{outline:2px solid var(--blue-600);outline-offset:2px}
.lang-flag{display:block;line-height:0;flex:none}
.lang-flag svg{width:1.375rem;height:auto;border-radius:2px;display:block}
.lang-btn .chev{width:.625rem;height:.625rem;fill:none;stroke:var(--gray-500);
  stroke-width:2;stroke-linecap:round;transition:transform .2s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + .5rem);right:0;z-index:90;margin:0;padding:.3125rem;
  list-style:none;background:#fff;border:1px solid var(--gray-200);border-radius:.75rem;
  box-shadow:var(--shadow-lg);min-width:max-content}
.lang-menu li{display:flex;align-items:center;gap:.625rem;padding:.5rem .6875rem;
  border-radius:.5rem;cursor:pointer;font-size:.875rem;color:var(--gray-700);white-space:nowrap}
.lang-menu li:hover,.lang-menu li[aria-selected="true"]{background:var(--gray-50);color:var(--gray-900)}
.lang-menu li[aria-selected="true"]{font-weight:600;color:var(--blue-600)}

/* ---- CTA de la barre ---- */
.nav-cta{display:none;align-items:center;padding:.5rem 1rem;border-radius:9999px;
  font-size:.875rem;font-weight:600;color:#fff;text-decoration:none;white-space:nowrap;
  background:linear-gradient(135deg,var(--blue-600),var(--green-500))}
.nav-cta:hover{filter:brightness(1.06)}

/* ============================ Hero ============================ */
.hero{padding:8rem 0 4rem;color:#fff;text-align:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:.5rem;
  background:rgb(255 255 255 / .2);padding:.5rem 1rem;border-radius:9999px;
  font-size:.875rem;margin-bottom:2rem;
}
.hero-badge svg{width:1rem;height:1rem;color:var(--yellow-300)}
.hero h1{font-size:2.25rem;font-weight:800;line-height:1.15;margin-bottom:1.5rem;text-wrap:balance}
.hero p{font-size:1.25rem;color:var(--blue-100);margin:0 auto 2.5rem;max-width:44rem;text-wrap:pretty}

.btn-yellow{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--yellow-400);color:var(--gray-900);
  padding:1rem 2rem;border-radius:9999px;
  font-size:1.125rem;font-weight:700;text-decoration:none;border:0;cursor:pointer;
  box-shadow:var(--shadow-lg);transition:background .2s,transform .2s;
}
.btn-yellow:hover{background:var(--yellow-300);transform:scale(1.05)}
.btn-yellow svg{width:1.25rem;height:1.25rem}

/* ============================ Cards ============================ */
.grid-3{display:grid;grid-template-columns:1fr;gap:1.5rem}
.card{
  background:#fff;border-radius:1rem;padding:1.5rem;box-shadow:var(--shadow-sm);
  transition:box-shadow .2s;height:100%;
}
.card:hover{box-shadow:var(--shadow-lg)}
.card-icon{
  width:3rem;height:3rem;border-radius:.75rem;background:var(--blue-50);
  display:flex;align-items:center;justify-content:center;margin-bottom:1rem;
}
.card-icon svg{width:1.5rem;height:1.5rem;color:var(--blue-600)}
.card h3{font-size:1.125rem;font-weight:700;color:var(--gray-800);margin-bottom:.5rem}
.card p{color:var(--gray-600);font-size:.9375rem}

/* ============================ Preuve ============================ */
.proof{
  background:#fff;border-radius:1.5rem;padding:2rem;box-shadow:var(--shadow-sm);
  border-left:4px solid var(--blue-600);
}
.proof p{font-size:1.125rem;color:var(--gray-700);text-wrap:pretty}
.proof strong{color:var(--gray-900);font-weight:700}
.proof-stat{
  display:block;font-size:3rem;font-weight:800;line-height:1;
  background:linear-gradient(135deg,#2563eb,#16a34a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:.5rem;
}

/* ============================ Étapes ============================ */
.steps{display:grid;grid-template-columns:1fr;gap:1.5rem;counter-reset:step}
.step{text-align:center}
.step-num{
  width:3rem;height:3rem;border-radius:9999px;margin:0 auto 1rem;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:1.25rem;
}
.step h3{font-size:1.0625rem;font-weight:700;color:var(--gray-800);margin-bottom:.375rem}
.step p{color:var(--gray-600);font-size:.9375rem}

/* ============================ Formulaire ============================ */
.form-shell{
  background:linear-gradient(135deg,var(--blue-600),var(--green-500));
  border-radius:1.5rem;padding:4px;box-shadow:var(--shadow-xl);
}
.form-inner{background:#fff;border-radius:calc(1.5rem - 4px);padding:2rem 1.5rem}
.form-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.form-head h2{font-size:1.5rem}
.step-badge{
  font-size:.8125rem;font-weight:600;color:var(--blue-600);
  background:var(--blue-50);padding:.25rem .625rem;border-radius:9999px;white-space:nowrap;
}
.progress{height:4px;background:var(--gray-200);border-radius:9999px;overflow:hidden;margin-bottom:1.5rem}
.progress span{display:block;height:100%;width:50%;border-radius:9999px;
  background:linear-gradient(135deg,#2563eb,#16a34a);transition:width .35s ease}

.fields{display:flex;flex-direction:column;gap:1rem}
label.lbl{display:block;font-size:.875rem;font-weight:500;color:var(--gray-700);margin-bottom:.25rem}
.field{
  width:100%;padding:.75rem 1rem;border-radius:.75rem;
  border:1px solid var(--gray-200);background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field:focus{border-color:var(--blue-500);box-shadow:0 0 0 2px var(--blue-200)}
.field.invalid{border-color:var(--red-500)}

/* Les 7 questions : cartes radio, texte libre de passer à la ligne.
   Un <select> natif tronquait le métier et la ville sur mobile. */
.preguntas{display:flex;flex-direction:column;gap:.625rem}
.pregunta{
  display:flex;align-items:flex-start;gap:.75rem;cursor:pointer;
  padding:.875rem 1rem;border:2px solid var(--gray-200);border-radius:.75rem;
  transition:border-color .15s,background-color .15s;
}
.pregunta:hover{border-color:var(--gray-300)}
.pregunta input{position:absolute;opacity:0;width:0;height:0}
.pregunta .dot{
  width:1.25rem;height:1.25rem;border-radius:9999px;flex-shrink:0;margin-top:.125rem;
  border:2px solid var(--gray-300);background:#fff;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.pregunta .dot::after{
  content:'';width:.5rem;height:.5rem;border-radius:9999px;background:#fff;
  transform:scale(0);transition:transform .15s;
}
.pregunta input:checked ~ .dot{background:var(--blue-600);border-color:var(--blue-600)}
.pregunta input:checked ~ .dot::after{transform:scale(1)}
.pregunta:has(input:checked){border-color:var(--blue-500);background:var(--blue-50)}
.pregunta input:focus-visible ~ .dot{box-shadow:0 0 0 2px var(--blue-200)}
.pregunta .txt{font-size:.9375rem;font-weight:500;color:var(--gray-800);line-height:1.45}

/* Cases moteurs IA */
.engines{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
.engine{
  display:flex;align-items:center;gap:.625rem;cursor:pointer;
  padding:.875rem;border:2px solid var(--gray-200);border-radius:.75rem;
  font-weight:600;font-size:.9375rem;transition:border-color .15s,background-color .15s;
}
.engine:hover{border-color:var(--gray-300)}
.engine input{position:absolute;opacity:0;width:0;height:0}
.engine .box{
  width:1.25rem;height:1.25rem;border-radius:.375rem;flex-shrink:0;
  border:2px solid var(--gray-300);background:#fff;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.engine .box svg{width:.875rem;height:.875rem;color:#fff;opacity:0;transition:opacity .15s}
.engine input:checked ~ .box{background:var(--green-600);border-color:var(--green-600)}
.engine input:checked ~ .box svg{opacity:1}
.engine:has(input:checked){border-color:var(--green-500);background:var(--green-50)}
.engine input:focus-visible ~ .box{box-shadow:0 0 0 2px var(--blue-200)}

/* RGPD */
.consent{display:flex;align-items:flex-start;gap:.625rem;cursor:pointer;
  font-size:.8125rem;color:var(--gray-600);line-height:1.5}
.consent input{margin-top:.1875rem;width:1rem;height:1rem;accent-color:var(--green-600);flex-shrink:0}
/* Cible tactile de 44px sur un lien en ligne : le padding vertical agrandit
   la zone cliquable sans modifier la hauteur de ligne ni décaler le texte. */
.consent a{color:var(--blue-600);font-weight:600;padding:.875rem 0}

.btn-primary{
  width:100%;color:#fff;padding:1rem;border-radius:.75rem;
  font-size:1.0625rem;font-weight:700;border:0;cursor:pointer;
}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{
  background:none;border:0;cursor:pointer;color:var(--gray-500);
  font-size:.875rem;font-weight:500;text-decoration:underline;
  min-height:44px;padding:0 1rem;
}
.btn-ghost:hover{color:var(--gray-700)}
.form-note{font-size:.8125rem;color:var(--gray-500);text-align:center;margin-top:.75rem}
.form-error{
  color:var(--red-500);font-size:.875rem;text-align:center;margin-top:.75rem;display:none;
}

/* Transition entre étapes */
.fstep{display:none}
.fstep.active{display:block;animation:stepIn .3s ease both}
@keyframes stepIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fstep.active{animation:none}
  .btn-yellow:hover{transform:none}
}

/* ============================ FAQ ============================ */
.faq{display:flex;flex-direction:column;gap:.75rem}
.faq details{
  background:#fff;border:1px solid var(--gray-200);border-radius:.75rem;overflow:hidden;
}
.faq summary{
  padding:1rem 1.25rem;font-weight:600;color:var(--gray-800);cursor:pointer;
  list-style:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{width:1.25rem;height:1.25rem;color:var(--gray-500);flex-shrink:0;transition:transform .2s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq .answer{padding:0 1.25rem 1.25rem;color:var(--gray-600);font-size:.9375rem}

/* ============================ Footer ============================ */
.site-footer{background:var(--gray-100);color:var(--gray-600);padding:3rem 0}
.footer-top{display:flex;flex-direction:column;align-items:center;gap:1.5rem;text-align:center}
.footer-brand{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.footer-brand .logo-mark{width:2rem;height:2rem;border-radius:.5rem}
.footer-brand .logo-mark svg{width:1.25rem;height:1.25rem}
.footer-slogan{color:var(--gray-500)}
.footer-contact{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem 1rem;font-size:.875rem}
/* min-height 44px : cible tactile conforme aux recommandations d'accessibilité */
.footer-contact a{
  display:flex;align-items:center;gap:.5rem;color:inherit;text-decoration:none;
  transition:color .2s;min-height:44px;padding:0 .25rem;
}
.footer-contact a svg{width:1rem;height:1rem}
.footer-contact a.tel:hover{color:var(--green-600)}
.footer-contact a.wa:hover{color:var(--green-500)}
.footer-contact a.mail:hover{color:var(--blue-600)}
.footer-legal{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem 1rem;font-size:.875rem;margin-top:1rem}
.footer-legal a{
  display:inline-flex;align-items:center;color:inherit;text-decoration:none;
  transition:color .2s;min-height:44px;padding:0 .5rem;
}
.footer-legal a:hover{color:var(--gray-800)}
.footer-bottom{
  margin-top:2rem;padding-top:2rem;border-top:1px solid var(--gray-200);
  text-align:center;font-size:.875rem;
}

/* ================= Boutons flottants tél + WhatsApp ================= */
#floating-buttons{
  position:fixed;bottom:24px;right:24px;z-index:60;
  display:flex;flex-direction:column;gap:12px;
  transition:bottom .25s ease,opacity .2s ease,visibility .2s ease;
}
#floating-buttons a{display:flex;align-items:center;justify-content:center;border-radius:50%;transition:transform .3s,box-shadow .3s}
#floating-buttons a:hover{transform:scale(1.1)}
.fab-tel{width:52px;height:52px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);box-shadow:0 4px 15px rgb(59 130 246 / .4)}
.fab-tel:hover{box-shadow:0 6px 20px rgb(59 130 246 / .5)}
.fab-tel svg{width:24px;height:24px;fill:#fff}
.fab-wa{width:60px;height:60px;background:var(--wa);box-shadow:0 4px 15px rgb(37 211 102 / .4);animation:pulse-wa 2s infinite}
.fab-wa:hover{box-shadow:0 6px 20px rgb(37 211 102 / .6)}
.fab-wa svg{width:30px;height:30px;fill:#fff}
@keyframes pulse-wa{
  0%,100%{box-shadow:0 4px 15px rgb(37 211 102 / .4)}
  50%{box-shadow:0 4px 30px rgb(37 211 102 / .7)}
}

/* ================= Barre CTA collante (mobile) ================= */
#sticky-cta{
  position:fixed;left:0;right:0;bottom:0;z-index:55;display:none;
  padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
  background:rgb(255 255 255 / .97);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--gray-200);
  box-shadow:0 -4px 16px rgb(0 0 0 / .08);
  transition:transform .25s ease;
}
#sticky-cta.hidden{transform:translateY(120%)}
#sticky-cta a{
  display:flex;align-items:center;justify-content:center;
  width:100%;color:#fff;padding:.875rem;border-radius:.75rem;
  font-weight:700;font-size:1rem;text-decoration:none;
}

/* ============================ Responsive ============================ */
@media (min-width:640px){
  .footer-top{flex-direction:row;justify-content:space-between;text-align:left}
  .footer-brand{flex-direction:row}
  .form-inner{padding:2rem}
}
@media (min-width:768px){
  .hero{padding:8rem 0 5rem}
  .hero h1{font-size:3.75rem}
  .hero p{font-size:1.5rem}
  .site-header .bar{padding:.75rem 1rem}
  .logo-mark{width:2.5rem;height:2.5rem}
  .logo-mark svg{width:1.5rem;height:1.5rem}
  .logo-text{font-size:1.25rem}
  h2{font-size:2.25rem}
  .grid-3,.steps{grid-template-columns:repeat(3,1fr)}
  .proof{padding:3rem}
  .proof p{font-size:1.25rem}
}
@media (min-width:768px){
  .nav-cta{display:inline-flex}
}
@media (min-width:1024px){
  .header-phone{display:flex}
}

/* Controle d'integrite : une cle manquante donnerait un texte vide a l'ecran. */
(function(){
  var ref = Object.keys(T.es), manquantes = [];
  ["ca","en"].forEach(function(l){
    ref.forEach(function(k){ if (T[l][k] === undefined) manquantes.push(l + "." + k); });
  });
  var utilisees = [];
  document.addEventListener("DOMContentLoaded", function(){
    document.querySelectorAll("[data-t]").forEach(function(e){ utilisees.push(e.getAttribute("data-t")); });
    document.querySelectorAll("[data-tph]").forEach(function(e){ utilisees.push(e.getAttribute("data-tph")); });
    utilisees.forEach(function(k){
      ["es","ca","en"].forEach(function(l){
        if (typeof T[l][k] !== "string") manquantes.push(l + "." + k + " (utilisee dans le DOM)");
      });
    });
    if (manquantes.length) console.error("[i18n] cles manquantes :", manquantes);
    else console.log("[i18n] toutes les cles sont presentes dans les trois langues");
  });
})();

function tr(){
  var t = T[lang];
  document.documentElement.lang = lang === "ca" ? "ca-ES" : lang === "es" ? "es-ES" : "en";
  document.querySelectorAll("[data-t]").forEach(function(el){
    var v = t[el.getAttribute("data-t")];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll("[data-tph]").forEach(function(el){
    var v = t[el.getAttribute("data-tph")];
    if (typeof v === "string") el.setAttribute("placeholder", v);
  });
  document.title = t.metaTitle;
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", t.metaDesc);
  var pg = document.getElementById("preguntas");
  if (pg) pg.setAttribute("aria-label", t.lblQue);
  var fl = document.getElementById("faq-list");
  if (fl) fl.innerHTML = t.faq.map(function(q){
    return '<details><summary>' + q[0] +
      '<svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9l-7 7-7-7"></path></svg>' +
      '</summary><div class="answer">' + q[1] + '</div></details>';
  }).join("");
  document.getElementById("langFlag").innerHTML = FLAGS[lang].svg;
  document.getElementById("langMenu").innerHTML = Object.keys(FLAGS).map(function(k){
    return '<li role="option" data-lang="' + k + '" tabindex="-1" aria-selected="'
      + (k === lang ? "true" : "false") + '"><span class="lang-flag">' + FLAGS[k].svg + '</span>' + FLAGS[k].nom + '</li>';
  }).join("");
  if (typeof window.renderPreguntas === "function") window.renderPreguntas();
}

/* ---- menu de langues : bouton + liste, clavier compris ---- */
document.addEventListener("DOMContentLoaded", function(){
  tr();
  var lBtn = document.getElementById("langBtn");
  var lMenu = document.getElementById("langMenu");
  function ouvrir(o){
    lMenu.hidden = !o;
    lBtn.setAttribute("aria-expanded", o ? "true" : "false");
    if (o){ var a = lMenu.querySelector('[aria-selected="true"]') || lMenu.firstElementChild; if (a) a.focus(); }
  }
  function choisir(l){
    lang = l;
    var u = new URL(location); u.searchParams.set("lang", lang);
    history.replaceState(null, "", u);
    tr();
  }
  lBtn.addEventListener("click", function(e){ e.stopPropagation(); ouvrir(lMenu.hidden); });
  lMenu.addEventListener("click", function(e){
    var li = e.target.closest("li[data-lang]"); if (!li) return;
    choisir(li.dataset.lang); ouvrir(false); lBtn.focus();
  });
  lMenu.addEventListener("keydown", function(e){
    var items = Array.prototype.slice.call(lMenu.querySelectorAll("li[data-lang]"));
    var i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      var nx = e.key === "ArrowDown" ? i + 1 : i - 1;
      items[(nx + items.length) % items.length].focus();
    } else if (e.key === "Home"){ e.preventDefault(); items[0].focus(); }
    else if (e.key === "End"){ e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === "Enter" || e.key === " "){
      e.preventDefault(); choisir(document.activeElement.dataset.lang); ouvrir(false); lBtn.focus();
    } else if (e.key === "Escape"){ e.preventDefault(); ouvrir(false); lBtn.focus(); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !lMenu.hidden){ ouvrir(false); lBtn.focus(); }
  });
  document.addEventListener("click", function(e){
    if (!lMenu.hidden && !document.getElementById("langWrap").contains(e.target)) ouvrir(false);
  });
});
</script>

    var preguntaTexto = elegida.parentNode.querySelector('.txt').textContent;

    // 1. Supabase — donnée structurée (échec toléré)
    var sbPromise = pushSupabase({
      oficio: oficio,
      ciudad: ciudad,
      pregunta_tipo: preguntaTipo,
      motores: motores,
      nombre: nombre,
      email: email,
      origen: ORIGEN
    });

    // 2. Web3Forms — notification email (fait foi pour le succès)
    var w3fPromise = pushWeb3Forms({
      access_key: WEB3FORMS_KEY,
      subject: SUBJECT,
      from_name: 'LP Visibilidad IA',
      nombre: nombre,
      email: email,
      oficio: oficio,
      ciudad: ciudad,
      pregunta: preguntaTexto,
      pregunta_tipo: preguntaTipo,
      motores: motores.join(', '),
      origen: ORIGEN,
      botcheck: false
    });

    Promise.allSettled([sbPromise, w3fPromise]).then(function(results){
      var w3f = results[1];

      if(w3f.status === 'rejected'){
        console.error('[Web3Forms]', w3f.reason);
        sent = false;
        btnSubmit.disabled = false;
        btnSubmit.textContent = T[lang].btnSubmit;
        showError(err2, T[lang].errSend);
        return;
      }

      // Succès → GA4 puis redirection (attend le beacon, max 2 s)
      var done = false;
      function go(){ if(!done){ done = true; window.location.href = THANKS_URL; } }

      if(typeof gtag === 'function'){
        gtag('event', 'generate_lead', {
          event_category: 'lp_visibilidad_ia',
          event_label: oficio + ' / ' + ciudad,
          currency: 'EUR',
          value: 0,
          event_callback: go
        });
        setTimeout(go, 2000);
      } else {
        go();
      }
    });
  });

  /* ---------- CTA collant mobile + effacement des boutons flottants ----------
     Le formulaire : les FAB ne doivent jamais recouvrir le bouton d'envoi ni
     le texte RGPD. Le footer : ils recouvraient le lien « Cookies », ce qui
     annulait la cible tactile de 44 px. On les efface dans les deux cas. */
  document.body.classList.add('has-sticky');
  if('IntersectionObserver' in window){
    var formEl   = document.getElementById('formulario');
    var footerEl = document.querySelector('.site-footer');
    var enVue    = { form: false, footer: false };

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.target === formEl)   enVue.form   = e.isIntersecting;
        if(e.target === footerEl) enVue.footer = e.isIntersecting;
      });
      // La barre collante ne se cache que pour le formulaire : au niveau du
      // footer elle reste le dernier rappel du CTA.
      sticky.classList.toggle('hidden', enVue.form);
      document.body.classList.toggle('has-sticky', !enVue.form);
      document.body.classList.toggle('form-en-vue', enVue.form || enVue.footer);
    }, { threshold: 0.12 });

    io.observe(formEl);
    io.observe(footerEl);
  }

  /* ---------- Suivi des clics CTA ---------- */
  document.querySelectorAll('[data-cta]').forEach(function(el){
    el.addEventListener('click', function(){
      if(typeof gtag === 'function'){
        gtag('event', 'cta_click', {
          event_category: 'lp_visibilidad_ia',
          event_label: el.getAttribute('data-cta')
        });
      }
    });
  });

})();
</script>
